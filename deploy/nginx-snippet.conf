# 投喂台 · nginx 反代（可选）
#
# ═══════════════════════════════════════════════════════════════════════
# 先说清「开隧道」和「nginx 反代」的区别 —— 两条路都能用，安全性差很多。
#
# 服务默认只监听 127.0.0.1:8765（compose 的 ports 写的是
# "127.0.0.1:8765:8765"），所以从 VPS 外面**根本连不上**。这是刻意的：
# 它持有明文上游 Key，且能改写 config.yaml。
#
# 方案 A · SSH 隧道（推荐，零配置）
#   在**你自己的电脑**上跑：
#       ssh -N -L 8765:127.0.0.1:8765 root@<你的VPS-IP>
#   意思是：把 VPS 上的 127.0.0.1:8765 映射到你电脑的 127.0.0.1:8765，
#   数据走 SSH 加密通道。公网上不存在这个端口，扫不到、爆破不了。
#   -N 表示只做转发不开 shell，所以这条命令会占住终端不返回 —— 正常现象，
#   另开一个窗口用浏览器访问 http://127.0.0.1:8765/，用完 Ctrl-C 断开。
#
#   优点：零额外攻击面、不用证书、不改防火墙、不动 nginx.conf
#   缺点：每次要先开隧道；手机上不方便
#
# 方案 B · nginx 反代到独立域名（下面这段）
#   优点：直接输网址就能开，手机也行
#   缺点：多一个公网入口。必须叠加 TLS + IP 白名单，缺一不可
# ═══════════════════════════════════════════════════════════════════════
#
#
# ⚠️ 关键实测结论：**不要加 basic auth**
#
# 本部署的 nginx.conf 在 cpas.example.com 那段已经记过这个坑
# （2026-08-26 实测）：basic auth 和 Bearer **抢同一个 Authorization 头**。
#
# 投喂台是同一个问题 —— 前端 web/app.js:66 写的是
#     o.headers['Authorization'] = 'Bearer ' + S.token;
# 它会覆盖浏览器为 basic auth 发的 "Authorization: Basic ..."。
# 结果：页面本身能打开（浏览器发 Basic，过了 nginx），
# 但页面 JS 发出的每个 API 请求都带 Bearer，被 nginx 判为非法 basic 凭据
# 而 401 —— 界面会一直卡在加载状态，日志里只有静态资源到达了容器。
#
# 所以这一层只能用**不占用 Authorization 头**的方式：
#   · nginx IP 白名单（allow/deny）—— 下面用的这个
#   · Cloudflare Access（走 cookie）
#
# 投喂台自身的鉴权是可靠的（服务端 server.py:384 校验 Bearer，
# 失败 5 次封该 IP 30 分钟），nginx 这层只是再加一道网络围栏。
#
#
# ───────────────────────────────────────────────────────────────────────
# 用法：把下面整段并进 /opt/deploy/nginx.conf 的 http {} 块内，
#       与 cpa.example.com / cpas.example.com 那两个 server 并列。
#
#       域名要先在 Cloudflare 建好 A 记录（或 CNAME 到现有的），
#       证书沿用本部署既有的通配证书。
# ───────────────────────────────────────────────────────────────────────

    # importer.example.com -> 本机 8765 端口（投喂台）
    #
    # 域名任取，只要与 nginx.conf 里其他 49 个 server_name 不冲突。
    # 「cpai」= CPA importer；也可以用 feed / import 之类。
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name importer.example.com;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript;

        # ── 第一道：IP 白名单 ────────────────────────────────────────
        # 这一层不能省。理由：token 会出现在 URL 里（?token=...），
        # 而 URL 会进浏览器历史、也可能进 nginx access_log。
        # 白名单让「拿到 token 的人」还得在正确的网络位置才能用。
        #
        # 查你的出口 IP：curl -s https://api.ipify.org
        # 家宽是动态 IP 的话，这条会经常失效 —— 那种情况请用 SSH 隧道，
        # 或改用 Cloudflare Access（按账号而非 IP 授权）。
        allow 203.0.113.7;          # ← 换成你的固定出口 IP
        # allow 198.51.100.0/24;    # 有多个网段就多写几行
        deny  all;

        # ── 不要加 basic auth ────────────────────────────────────────
        # 见文件开头的说明。加了会让界面卡在加载状态。
        # auth_basic "importer";                    ← 不要这样写
        # auth_basic_user_file /etc/nginx/.htpasswd; ← 不要这样写

        # token 在 query string 里，别记进日志
        access_log off;
        # 想留访问记录就换成这行（自定义 format 去掉 $request 的 query 部分）：
        # access_log /var/log/nginx/importer.log combined;

        location / {
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:8765;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 探测是长任务：一个候选四段全测可能几分钟，开上下文探测更久。
            # nginx 默认 60s 会在轮询中途断开 —— 必须放宽，否则前端会
            # 看到「轮询失败」而任务其实还在跑。
            proxy_read_timeout    900;
            proxy_send_timeout    900;
            proxy_connect_timeout 30;
            send_timeout          900;

            # /api/job 是轮询端点，要即时返回，不能被缓冲攒着
            proxy_buffering off;
            proxy_cache off;

            # 上传 txt 用不到大 body，但 diff 预览响应可能几百 KB
            client_max_body_size 4m;
        }
    }

# ───────────────────────────────────────────────────────────────────────
# 改完必须先验证再重载。nginx.conf 有 1757 行、49 个 server_name，
# 语法错会让**整个网关**起不来（cpa / cpas 一起挂）：
#
#     nginx -t                  # 先验证（宿主机装的 nginx，不在容器里）
#     nginx -s reload           # 通过了才 reload
#
# reload 是热的，不中断现有连接。不要用 systemctl restart nginx ——
# 那会让所有站点短暂 502。
# ───────────────────────────────────────────────────────────────────────
#
#
# ═══════════════════════════════════════════════════════════════════════
# 两个方案的实际差别，按你的场景选：
#
#                        SSH 隧道              nginx 反代
#   公网暴露             无                    有（一个域名）
#   要不要配证书         不要                  要（沿用通配证书即可）
#   要不要改 nginx.conf  不要                  要（1757 行的生产文件）
#   手机能用             不方便                能
#   每次操作             先开隧道              直接输网址
#   出口 IP 变动         无影响                白名单失效，要改配置
#
# 只是偶尔加几个账号 —— 用隧道。
# 要经常用、或想在手机上看 —— 配反代，但三层（TLS + 白名单 + 长 token）
# 缺一不可。
# ═══════════════════════════════════════════════════════════════════════

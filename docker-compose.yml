# 投喂台 · 独立部署（不带 CPA 主栈时用这份）
#
#   cp .env.example .env && $EDITOR .env    # CONFIG_PATH 必填
#   docker compose up -d
#   docker compose logs -f                  # 日志里有带 token 的访问地址
#   docker compose down                     # 用完关掉，它持有明文 Key
#
# 默认拉远程镜像。要改代码就本地构建，见下面 build 段的说明。

name: cpa-upstream-importer

services:
  cpa-upstream-importer:
    image: ${IMAGE:-swhesong/cpa-upstream-importer:latest}
    # 升级：docker compose pull && docker compose up -d
    pull_policy: ${PULL_POLICY:-missing}

    # 本地构建：.env 里设 PULL_POLICY=build，镜像就取本地 tag 而不去 registry。
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_UID: ${IMPORTER_UID:-10001}
        APP_GID: ${IMPORTER_GID:-10001}

    container_name: ${CONTAINER_NAME:-cpa-upstream-importer}
    restart: "no"           # 按需启的运维工具，崩了要人看日志

    # 只绑回环。写成 "8765:8765" 会暴露到公网 —— 这界面持有明文上游 Key
    # 且能改写 config.yaml。外网访问经 nginx 加 TLS，见 deploy/nginx-snippet.conf。
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8765}:8765"

    # 必须与 config.yaml 属主一致，否则写回 PermissionError。
    # 查属主：stat -c '%u:%g' /path/to/config.yaml
    user: "${IMPORTER_UID:-0}:${IMPORTER_GID:-0}"

    environment:
      IMPORTER_HOST: "0.0.0.0"        # 容器内监听，暴露面由上面 ports 限制
      IMPORTER_PORT: "8765"
      IMPORTER_CONFIG: "/data/config.yaml"
      IMPORTER_BACKUP_DIR: "/backups"
      # 不设则每次启动随机生成并打印到日志；也可直接用 CPA 后台管理密码登录
      IMPORTER_TOKEN: "${IMPORTER_TOKEN:-}"
      # 写回后主动 PUT 让 CPA 立即重载 —— inotify 事件可能丢，而 CPA 没有
      # 轮询兜底。同栈填服务名，独立部署填宿主可达地址。
      CPA_UPSTREAM_URL: "${CPA_UPSTREAM_URL:-http://127.0.0.1:8317}"

    volumes:
      # 只挂这一个文件：挂整个目录等于把 .env、secrets/、auths/ 一起递给它。
      # 单文件挂载把宿主 inode 定死，所以写回是就地 O_TRUNC 覆写而非
      # tmp+rename —— 换 inode 会让 CPA 永远读旧文件。
      - "${CONFIG_PATH:?必须在 .env 里设 CONFIG_PATH，指向你的 CPA config.yaml}:/data/config.yaml"
      - importer-backups:/backups    # 单文件挂载时同目录不可写，备份落命名卷

    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-512M}

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  importer-backups:

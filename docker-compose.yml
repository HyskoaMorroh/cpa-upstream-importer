# 投喂台 · 独立部署（不带 CPA 主栈时用这份）
#
#   cp .env.example .env && $EDITOR .env    # CONFIG_PATH 必填
#   docker compose up -d
#   docker compose logs -f                  # 日志里有带 token 的访问地址
#   docker compose down                     # 用完关掉，它持有明文 Key
#
# 默认拉远程镜像。要改代码就本地构建，见下面 build 段的说明。

name: cpa-upstream-importer

services:
  cpa-upstream-importer:
    image: ${IMAGE:-swhesong/cpa-upstream-importer:latest}
    # 升级：docker compose pull && docker compose up -d
    pull_policy: ${PULL_POLICY:-missing}

    # 本地构建：.env 里设 PULL_POLICY=build，镜像就取本地 tag 而不去 registry。
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_UID: ${IMPORTER_UID:-10001}
        APP_GID: ${IMPORTER_GID:-10001}

    container_name: ${CONTAINER_NAME:-cpa-upstream-importer}
    restart: "no"           # 按需启的运维工具，崩了要人看日志

    # 只绑回环。写成 "8765:8765" 会暴露到公网 —— 这界面持有明文上游 Key
    # 且能改写 config.yaml。外网访问经 nginx 加 TLS，见 deploy/nginx-snippet.conf。
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8765}:8765"

    # 必须与 config.yaml 属主一致，否则写回 PermissionError。
    # 查属主：stat -c '%u:%g' /path/to/config.yaml
    user: "${IMPORTER_UID:-0}:${IMPORTER_GID:-0}"

    environment:
      IMPORTER_HOST: "0.0.0.0"        # 容器内监听，暴露面由上面 ports 限制
      IMPORTER_PORT: "8765"
      IMPORTER_CONFIG: "/data/config.yaml"
      IMPORTER_BACKUP_DIR: "/backups"
      # 不设则每次启动随机生成并打印到日志；也可直接用 CPA 后台管理密码登录
      IMPORTER_TOKEN: "${IMPORTER_TOKEN:-}"
      # 写回后主动 PUT 让 CPA 立即重载 —— inotify 事件可能丢，而 CPA 没有
      # 轮询兜底。同栈填服务名，独立部署填宿主可达地址。
      CPA_UPSTREAM_URL: "${CPA_UPSTREAM_URL:-http://127.0.0.1:8317}"
      # 日志级别（修改要求第 11 条）：DEBUG 输出每次上游请求详情，便于排查
      # 探测失败、写回异常等问题；INFO（默认）只记关键里程碑；
      # docker compose logs -f 实时跟踪。
      IMPORTER_LOG_LEVEL: "${IMPORTER_LOG_LEVEL:-INFO}"
      # CPA 管理接口令牌。**不配就等于「按运行状态定优先级」静默失效** ——
      # `plan.py` 调 `fetch_cpa_runtime_health(base_url)` 时不传 token 参数，
      # 只读环境变量；拿不到授权头时 `/v0/management/api-key-usage` 返回
      # 401/403，函数返回 None，于是健康分退回静态检测分（用户第 3⑶ 条要求的
      # 「按真实运行状态定档」落空），而日志里只有一行 info 级的
      # 「CPA 运行时数据不可用」。这个变量直到 2026-09-16 才补进本文件 ——
      # 在此之前照本文件部署的实例，那条特性一次都没生效过。
      # 取值：CPA 后台管理密码，或 config.yaml 里 remote-management.secret-key
      # 对应的原始密码（CPA 自己会把哈希贴到该字段）。
      CPA_MANAGEMENT_TOKEN: "${CPA_MANAGEMENT_TOKEN:-}"
      # 可选：CLIProxyAPI 源码根（配 CPA_SOURCE 挂载时才有意义）。
      # 给了才能精确核对画像梯是否随 CPA 升级而过期 —— 它会解析
      # claude_executor_request.go 里的 beta 常量表与 codex 的 UA/originator。
      # 不给则退回读 config.yaml 的 claude-header-defaults，覆盖面小得多。
      CPA_SOURCE_ROOT: "${CPA_SOURCE_ROOT:-}"

    volumes:
      # 只挂这一个文件：挂整个目录等于把 .env、secrets/、auths/ 一起递给它。
      # 单文件挂载把宿主 inode 定死，所以写回是就地 O_TRUNC 覆写而非
      # tmp+rename —— 换 inode 会让 CPA 永远读旧文件。
      - "${CONFIG_PATH:?必须在 .env 里设 CONFIG_PATH，指向你的 CPA config.yaml}:/data/config.yaml"
      - importer-backups:/backups    # 单文件挂载时同目录不可写，备份落命名卷
      # 可选：把 CLIProxyAPI 源码只读挂进来，画像基线漂移检测才能精确工作。
      # 在 .env 里设 CPA_SOURCE=/path/to/CLIProxyAPI 与
      # CPA_SOURCE_ROOT=/cpa-source 同时生效。留空则整条挂载不生效
      # （`${VAR:-/dev/null}:/x:ro` 这种写法在留空时会挂个空设备，比报错好）。
      - "${CPA_SOURCE:-/dev/null}:/cpa-source:ro"

    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-512M}

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── mihomo 代理 ─────────────────────────────────────────────────────
  #
  # 为什么是两个服务而不是一个：mihomo 要长驻前台跑，配置物化要跑完就退，
  # 一个容器做不了两件事。init 用同一个镜像（里面有 python3 与模板），
  # mihomo-proxy 也用同一个镜像（里面有 /usr/local/bin/mihomo 二进制）——
  # 所以整套仍然只需要拉**一个**镜像，符合"VPS 只拉镜像"的部署方式。
  #
  # 两者通过命名卷 mihomo-config 交接：init 写 config.yaml，proxy 读它。
  # 卷是持久的，所以 probe-upstreams.py 写进 AUTO 组 filter 的探测结果
  # 在重启后仍然生效（init 默认不覆盖已有配置）。
  mihomo-init:
    image: ${IMAGE:-swhesong/cpa-upstream-importer:latest}
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: ${CONTAINER_NAME:-cpa-upstream-importer}-mihomo-init
    profiles: ["mihomo"]        # 不需要代理的部署用 --profile 跳过整块
    restart: "no"               # 跑完就退，重启反而会重复物化
    user: "0:0"                 # 要写命名卷，用 root 省掉 uid 对齐的麻烦
    entrypoint: ["/app/mihomo-manager/bootstrap-mihomo.sh"]
    environment:
      MIHOMO_TARGET_DIR: "/mihomo-config"
      # RESTful API 鉴权。留空则不设 —— 但 9090 绑在 0.0.0.0，同一 Docker
      # 网络内的任何容器都能切换出口、读出全部节点地址，建议必填。
      MIHOMO_SECRET: "${MIHOMO_SECRET:-}"
      # 订阅。两种写法二选一：
      #   MIHOMO_SUBSCRIPTIONS="名称1=URL1;名称2=URL2"   （分号分隔）
      #   MIHOMO_SUB_<大写名称>=URL                       （每个一个变量）
      MIHOMO_SUBSCRIPTIONS: "${MIHOMO_SUBSCRIPTIONS:-}"
      MIHOMO_SUB_WOG: "${MIHOMO_SUB_WOG:-}"
      MIHOMO_SUB_WOGB: "${MIHOMO_SUB_WOGB:-}"
      # 设为 1 则用模板覆盖现有配置（会先备份）。日常留空。
      MIHOMO_FORCE_REBUILD: "${MIHOMO_FORCE_REBUILD:-}"
    volumes:
      - mihomo-config:/mihomo-config

  mihomo-proxy:
    image: ${IMAGE:-swhesong/cpa-upstream-importer:latest}
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: ${CONTAINER_NAME:-cpa-upstream-importer}-mihomo
    profiles: ["mihomo"]
    restart: unless-stopped
    depends_on:
      mihomo-init:
        # 必须等物化完成 —— 配置还没写好就启动，mihomo 会因找不到
        # config.yaml 而退出，再被 restart 策略拉起，形成启动风暴。
        condition: service_completed_successfully
    # 镜像默认 entrypoint 是 importer 的 server.py，这里覆盖成代理本体。
    # -d 指定配置目录，mihomo 会读其中的 config.yaml。
    entrypoint: ["/usr/local/bin/mihomo", "-d", "/mihomo-config"]
    user: "0:0"
    # 网络别名 `mihomo`（2026-09-17）
    # ------------------------------
    # 本模板的服务名是 mihomo-proxy，而线上整栈那份 compose 叫 mihomo。
    # 代码里的回落地址（server.py proxy_candidates、cli.py --proxy 自动探测）
    # 与 config.yaml 里已写好的 34 条 `proxy-url: http://mihomo:7890` 全用
    # 短名。没有这个别名，用本模板部署时 CPA 和 importer 都解析不到代理：
    # 探测判「需代理」的站全部走直连，写回的 proxy-url 也是死的。
    # 加别名后两个名字都通，模板与整栈两种部署共用同一份 config.yaml。
    networks:
      default:
        aliases:
          - mihomo
    ports:
      # 只绑回环。7890 是 CPA 的 proxy-url 目标，9090 供探测脚本调用。
      # 容器间走服务名（http://mihomo-proxy:7890），不依赖这两个映射。
      - "${MIHOMO_BIND:-127.0.0.1}:${MIHOMO_MIXED_PORT:-7890}:7890"
      - "${MIHOMO_BIND:-127.0.0.1}:${MIHOMO_API_PORT:-9090}:9090"
    volumes:
      - mihomo-config:/mihomo-config
    healthcheck:
      # 不只判活，还会在节点全挂时把 PROXY 组切到 DIRECT ——
      # docker 的 healthcheck 本身改不了 mihomo 选路，那件事得脚本自己做。
      # 详见 mihomo-manager/mihomo/healthcheck.py 的开头说明。
      test: ["CMD", "python3", "/mihomo-config/healthcheck.py"]
      interval: 60s
      timeout: 20s
      retries: 2
      start_period: 30s
    environment:
      MIHOMO_SECRET: "${MIHOMO_SECRET:-}"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  importer-backups:
  mihomo-config:
